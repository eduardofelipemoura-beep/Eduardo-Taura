<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Carreira nos Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="caixa-principal">
        <h1 class="titulo-honrado">Defina sua carreira como programador de games</h1>

        <div class="tela-inicial">
            <p>
                Em meio aos avanços da tecnologia e da Inteligência Artificial, sua jornada como desenvolvedor de jogos está prestes a começar. Faça suas escolhas e veja qual caminho sua carreira irá trilhar.
            </p>
            <button class="iniciar-btn">Iniciar</button>
        </div>

        <div class="barra-progresso-container">
            <div class="barra-progresso-preenchimento"></div>
        </div>

        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>

        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
            <button class="novamente-btn">Jogar novamente</button>
        </div>
    </main>

    <script type="module" src="js/aleatorio.js"></script>
    <script type="module" src="js/perguntas.js"></script>
    <script type="module" src="js/script.js"></script>
</body>
</html>
